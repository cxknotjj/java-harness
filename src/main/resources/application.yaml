spring:
  application:
    name: javaHarness
  ai:
    openai:
      # 通义千问 DashScope 的 OpenAI 兼容模式
      # （Spring AI 会自动在此 base-url 后拼接 /v1/chat/completions）
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 占位 key：保证无真实 key 也能启动；真实调用需配置环境变量 DASHSCOPE_API_KEY
      api-key: ${QWEN_API:dummy-key-for-startup}
      chat:
        options:
          # 可选 qwen-turbo / qwen-plus / qwen-max
          model: qwen3.7-plus
          temperature: 0.7
  datasource:
    url: jdbc:mysql://localhost:3306/harness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: file:./sql/schema.sql
      continue-on-error: false

server:
  port: 8080

logging:
  level:
    # 无 API key 时 Spring AI 重试器会打整屏堆栈，压掉（失败信息由 AgentService 紧凑记录）
    org.springframework.ai.retry: ERROR
